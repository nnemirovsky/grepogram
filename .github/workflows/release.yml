name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      # the tag is the release: refuse to publish one that disagrees with the
      # version the package would install as
      - name: check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oE '__version__ = "[^"]+"' grepogram/__init__.py | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match grepogram/__init__.py version $version" >&2
            exit 1
          fi

      - run: uv build

      # gh ships on the runner, so the release needs no third-party action
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
