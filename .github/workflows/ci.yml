name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # the suite runs against the fake embedder/reranker; the dense extra (torch,
  # sentence-transformers) is never installed and no model is ever downloaded
  GREPOGRAM_FAKE_MODELS: "1"
  HF_HUB_OFFLINE: "1"
  # sqlite-vec is a loadable extension, so the interpreter needs
  # --enable-loadable-sqlite-extensions. uv prefers a system interpreter over downloading a
  # managed one, and the macOS runner's /usr/local/bin/python3.12 is the python.org installer
  # build, which is compiled without it; uv's own managed builds have it on macOS and on Linux.
  UV_MANAGED_PYTHON: "1"

jobs:
  test:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy grepogram tests
      - run: uv run pytest --cov=grepogram --cov-branch --cov-report=term-missing

  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy grepogram tests
